services:
  api:
    build: ./api
    container_name: extanalyze-api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      DATABASE_URL: postgresql://extanalyze:devpassword@postgres:5432/extanalyze
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: extanalyze-postgres
    environment:
      POSTGRES_USER: extanalyze
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: extanalyze
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: extanalyze-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  worker:
    build: ./worker
    container_name: extanalyze-worker
    volumes:
      - ./worker:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/desktop/mnt/host/c/extanalyze_shared:/shared
    environment:
      DATABASE_URL: postgresql://extanalyze:devpassword@postgres:5432/extanalyze
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      SANDBOX_IMAGE: extanalyze-sandbox:latest
      SHARED_TMP: /shared
      HOST_SHARED_TMP: /run/desktop/mnt/host/c/extanalyze_shared
    depends_on:
      - redis
      - postgres
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: extanalyze-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data: